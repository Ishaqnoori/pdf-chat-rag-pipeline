name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # same as the deployed app
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pytest pip-audit
      - name: Run tests
        run: pytest -q
      - name: Check dependencies for known vulnerabilities (blocks the build)
        # If a finding can't be fixed yet, add "--ignore-vuln <ID>" here with a comment explaining why.
        run: pip-audit -r requirements.txt

  secrets:
    # Scans every commit in the repo's history for leaked keys (item 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
