# Run on a server with Docker:  docker compose -f deploy/docker-compose.yml up -d
# Needs ports 80 and 443 open and your domain's DNS pointing at the server.
services:
  app:
    build: ..
    env_file: ../.env
    volumes:
      - ../firebase-service-account.json:/app/firebase-service-account.json:ro
    restart: unless-stopped
    expose:
      - "8501"   # reachable only through Caddy, never directly
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    restart: unless-stopped
volumes:
  caddy_data:
